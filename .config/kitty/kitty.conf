# Font Settings (JetBrains Mono Nerd Font, Size 9)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Window Padding & Opacity
window_padding_width 10
background_opacity 0.95

# Cursor Settings
cursor_shape beam
cursor_trail 1

# Keybindings (Ctrl+Backspace deletes whole word)
map ctrl+backspace send_text all \x17

# Primary Colors
background #0d0912
foreground #f5d9ec

# Cursor Colors
cursor #ff2fb0
cursor_text_color #0d0912

# Normal Colors
color0 #1a1220
color1 #ff3b7d
color2 #ff6ec7
color3 #ff8fd4
color4 #c724b1
color5 #ff2fb0
color6 #e05fc4
color7 #f5d9ec

# Bright Colors
color8  #3a2a3d
color9  #ff5c94
color10 #ff8fd4
color11 #ffb3e0
color12 #e04fd1
color13 #ff5cd6
color14 #f088dd
color15 #ffffff

# Audio
enable_audio_bell no

allow_remote_control yes
listen_on unix:@mykitty
enabled_layouts splits,stack
