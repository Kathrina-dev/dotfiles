conky.config = {
    -- Window Visuals & Transparency
    own_window = true,
    own_window_type = 'normal',
    own_window_hints = 'undecorated,above,sticky,skip_taskbar,skip_pager',
    own_window_colour = '#090909',

    -- Position & Geometry
    alignment = 'top_right',
    gap_x = 60,
    gap_y = 70,
    minimum_width = 250,
    maximum_width = 280,

    -- Window Borders & Styling
    border_width = 3,
    border_inner_margin = 20,
    draw_borders = true,

    -- Font & Rendering Engine
    use_xft = true,
    override_utf8_locale = true,
    font = 'Noto Sans:size=9.5',

    -- Master Color Palette
    default_color = '#c44582',
    color1 = '#c44582',
    color2 = '#918a8f',
    color3 = '#ffffff',

    -- Performance Settings
    double_buffer = true,
    no_buffers = false,
    update_interval = 3,
    update_interval_on_start = 1,

};

conky.text = [[
${alignc}${font Noto Sans:size=18:bold}${color3}${time %H:%M}${font}${color}
${alignc}${color2}${font Noto Sans:size=8}${time %A · %d %B %Y}${font}${color}

${color1}${font Noto Sans:bold:size=9}SYSTEM${font}${color}
${color2}${hr 1}${color}
${color2}CPU USAGE${alignr}${color3}${cpu}%${color}
${font JetBrainsMono Nerd Font:size=9}${execpi 2 python3 ~/.config/conky/scripts/braille_graph.py "cpu" "${cpu}" "100"}${font}
${color2}GPU USAGE${alignr}${color3}${nvidia gpuutil}%${color}
${font JetBrainsMono Nerd Font:size=9}${execpi 2 python3 ~/.config/conky/scripts/braille_graph.py "gpu" "${nvidia gpuutil}" "100"}${font}
${color2}BATTERY DRAIN${alignr}${color3}${execpi 5 python3 ~/.config/conky/scripts/bat_watts.py}${color}
${font JetBrainsMono Nerd Font:size=9}${execpi 5 python3 ~/.config/conky/scripts/braille_graph.py "bat" "0" "30"}${font}
${color2}RAM USAGE${alignr}${color3}${mem} / ${memmax}${color}
${color1}${membar 4}${color}
${color2}DISK FREE${alignr}${color3}${fs_free /}${color}
${color1}${fs_bar 4 /}${color}
${color2}TEMP:${alignr}${color3}${acpitemp}°C${color}
${color2}IP ADDR:${alignr}${color3}${addr wlan0}${color}
${color2}TERMINALS:${alignr}${color3}${exec pgrep -c -x "kitty"}${color}
${color2}PROCESSES:${alignr}${color3}${processes}${color}
${color2}RUNNING:${alignr}${color3}${running_processes}${color}
${voffset 1}
${color1}${font Noto Sans:bold:size=9}NETWORK${font}${color}
${color2}${hr 1}${color}
${color2}DOWNLOAD${alignr}${color3}${downspeed wlan0}${color}
${font JetBrainsMono Nerd Font:size=9}${execpi 2 python3 ~/.config/conky/scripts/braille_graph.py "net_down" "0" "auto"}${font}
${color2}UPLOAD${alignr}${color3}${upspeed wlan0}${color}
${font JetBrainsMono Nerd Font:size=9}${execpi 2 python3 ~/.config/conky/scripts/braille_graph.py "net_up" "0" "auto"}${font}
${voffset 1}
${color1}${font Noto Sans:bold:size=9}TOP CPU PROCESSES${font}${color}
${color2}${hr 1}${color}
${color2}${top name 1}${alignr}${color3}${top cpu 1}%${color}
${color2}${top name 2}${alignr}${color3}${top cpu 2}%${color}
${color2}${top name 3}${alignr}${color3}${top cpu 3}%${color}
${color2}${top name 4}${alignr}${color3}${top cpu 4}%${color}
${voffset 1}
${color1}${font Noto Sans:bold:size=9}CALENDAR${font}${color}
${color2}${hr 1}${color}
${alignc}${font JetBrainsMono Nerd Font:size=9}${execpi 60 python3 ~/.config/conky/scripts/conky_calendar.py}${font}
]];