########################################
# PICOM — BLACK + NEON PINK
# Desktop / subtle glass aesthetic
########################################

backend = "glx";
vsync = true;

unredir-if-possible = false;


########################################
# SHADOWS
########################################

shadow = true;

shadow-radius = 10;
shadow-opacity = 0.55;

shadow-offset-x = -6;
shadow-offset-y = -6;

shadow-color = "#ff1493";


########################################
# FADING
########################################

fading = true;

fade-in-step = 0.03;
fade-out-step = 0.03;


########################################
# ROUNDED WINDOWS
########################################

corner-radius = 10;

detect-rounded-corners = true;
detect-client-opacity = true;


########################################
# BLUR
########################################

blur-background = false;


########################################
# WINDOW RULES
########################################

rules = (

    # ----------------------------------
    # ROFI APP LAUNCHER
    # ----------------------------------
    {
        match = "class_g = 'Rofi'";

        opacity = 1.0;

        shadow = false;
        blur-background = false;
        corner-radius = 0;

        animations = (

            {
                triggers = ["open", "show"];
                preset = "appear";
                duration = 0.12;
            },

            {
                triggers = ["close", "hide"];
                preset = "disappear";
                duration = 0.10;
            }

        );
    },

    # ----------------------------------
    # NORMAL WINDOWS
    # ----------------------------------
    {
        match = "window_type = 'normal'";

        opacity = 1.0;

        shadow = true;
        shadow-radius = 10;
        shadow-opacity = 0.55;
        shadow-offset-x = -6;
        shadow-offset-y = -6;
        shadow-color = "#ff1493";

        blur-background = false;

        animations = (

            {
                triggers = ["open", "show"];
                preset = "fly-in";
                direction = "left";
                duration = 0.15;
            },

            {
                triggers = ["close", "hide"];
                preset = "fly-out";
                direction = "right";
                duration = 0.12;
            },

            {
                triggers = ["resize", "geometry"];
                preset = "geometry-change";
                duration = 0.18;
            }

        );
    },


    # ----------------------------------
    # KITTY TERMINALS
    # ----------------------------------
    {
        match = "window_type = 'normal' && class_g = 'kitty'";

        opacity = 0.72;

        shadow = true;
        shadow-radius = 10;
        shadow-opacity = 0.55;
        shadow-offset-x = -6;
        shadow-offset-y = -6;
        shadow-color = "#ff1493";

        blur-background = false;

        animations = (

            {
                triggers = ["open", "show"];
                preset = "fly-in";
                direction = "left";
                duration = 0.15;
            },

            {
                triggers = ["close", "hide"];
                preset = "fly-out";
                direction = "right";
                duration = 0.12;
            }

        );
    },


    # ----------------------------------
    # DIALOGS
    # ----------------------------------
    {
        match = "window_type = 'dialog'";

        opacity = 1.0;

        shadow = true;
        shadow-radius = 10;
        shadow-opacity = 0.55;
        shadow-offset-x = -6;
        shadow-offset-y = -6;
        shadow-color = "#ff1493";

        blur-background = false;
        corner-radius = 10;

        animations = (

            {
                triggers = ["open", "show"];
                preset = "appear";
                duration = 0.15;
            },

            {
                triggers = ["close", "hide"];
                preset = "disappear";
                duration = 0.12;
            }

        );
    },


    # ----------------------------------
    # POPUP MENUS
    # ----------------------------------
    {
        match = "window_type = 'popup_menu'";

        opacity = 1.0;

        shadow = false;
        blur-background = false;
        corner-radius = 8;

        animations = (

            {
                triggers = ["open", "show"];
                preset = "appear";
                duration = 0.12;
            },

            {
                triggers = ["close", "hide"];
                preset = "disappear";
                duration = 0.10;
            }

        );
    },


    # ----------------------------------
    # DROPDOWN MENUS
    # ----------------------------------
    {
        match = "window_type = 'dropdown_menu'";

        opacity = 1.0;

        shadow = false;
        blur-background = false;
        corner-radius = 8;

        animations = (

            {
                triggers = ["open", "show"];
                preset = "appear";
                duration = 0.12;
            },

            {
                triggers = ["close", "hide"];
                preset = "disappear";
                duration = 0.10;
            }

        );
    },


    # ----------------------------------
    # TOOLTIPS
    # ----------------------------------
    {
        match = "window_type = 'tooltip'";

        opacity = 1.0;

        shadow = false;
        blur-background = false;
        corner-radius = 8;

        animations = (

            {
                triggers = ["open", "show"];
                preset = "appear";
                duration = 0.10;
            },

            {
                triggers = ["close", "hide"];
                preset = "disappear";
                duration = 0.08;
            }

        );
    },


    # ----------------------------------
    # DOCKS
    # ----------------------------------
    {
        match = "window_type = 'dock'";

        opacity = 1.0;

        shadow = false;
        blur-background = false;
        corner-radius = 0;

        animations = (

            {
                triggers = ["open", "show"];
                preset = "appear";
                duration = 0.12;
            },

            {
                triggers = ["close", "hide"];
                preset = "disappear";
                duration = 0.10;
            }

        );
    },


    # ----------------------------------
    # POLYBAR
    # ----------------------------------
    {
        match = "class_g = 'Polybar'";

        opacity = 1.0;

        shadow = true;
        shadow-radius = 18;
        shadow-opacity = 0.65;
        shadow-offset-x = 0;
        shadow-offset-y = 0;
        shadow-color = "#ff1493";

        blur-background = false;
        corner-radius = 14;

        animations = (

            {
                triggers = ["open", "show"];
                preset = "appear";
                duration = 0.12;
            },

            {
                triggers = ["close", "hide"];
                preset = "disappear";
                duration = 0.10;
            }

        );
    },


    # ----------------------------------
    # DESKTOP
    # ----------------------------------
    {
        match = "window_type = 'desktop'";

        opacity = 1.0;

        shadow = false;
        blur-background = false;
        corner-radius = 0;

        animations = (

            {
                triggers = ["open", "show", "close", "hide"];
                duration = 0;
            }

        );
    },


    # ----------------------------------
    # FULLSCREEN APPLICATIONS
    # ----------------------------------
    {
        match = "fullscreen";

        opacity = 1.0;

        shadow = false;
        blur-background = false;
        corner-radius = 0;

        animations = (

            {
                triggers = ["open", "show", "close", "hide"];
                duration = 0;
            }

        );
    }

);