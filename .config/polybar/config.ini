[colors]
black = #090909
black-alt = #121012

pink = #ff1493
pink-soft = #c44582
pink-dark = #5a2942

white = #d8d4d7
gray = #918a8f

red = #b83d67


[bar/main]
width = 96%
height = 56

offset-x = 2%
offset-y = 8

bottom = false

background = #ee090909
foreground = ${colors.white}

radius = 14
border-size = 0

padding-left = 8
padding-right = 8

module-margin-left = 4
module-margin-right = 4

font-0 = Noto Sans:size=11;3
font-1 = Symbols Nerd Font Mono:size=15;3

override-redirect = true
; wm-restack = i3   <-- Kept commented out so Polybar can sit above windows
enable-struts = false

fixed-center = true

; =====================================================
; MODULE LAYOUT DEFINITIONS
; =====================================================
modules-left = i3
modules-right = pulseaudio network battery date system-menu

enable-ipc = true


[module/i3]
type = internal/i3

pin-workspaces = true
show-urgent = true

strip-wsnumbers = true
index-sort = true

enable-click = true
enable-scroll = true
wrapping-scroll = false
fuzzy-match = true

ws-icon-0 = 1;󰎆
ws-icon-1 = 2;󰖟
ws-icon-2 = 3;󰉋
ws-icon-3 = 4;󰨞
ws-icon-4 = 5;󰒋
ws-icon-5 = 6;
ws-icon-default = 󰜌

format = <label-state>

label-focused = %icon%
label-focused-font = 2
label-focused-foreground = ${colors.black}
label-focused-background = ${colors.pink}
label-focused-padding = 3

label-unfocused = %icon%
label-unfocused-font = 2
label-unfocused-foreground = ${colors.gray}
label-unfocused-background = ${colors.black-alt}
label-unfocused-padding = 3

label-visible = %icon%
label-visible-font = 2
label-visible-foreground = ${colors.white}
label-visible-background = ${colors.black-alt}
label-visible-padding = 3

label-urgent = %icon%
label-urgent-font = 2
label-urgent-foreground = ${colors.white}
label-urgent-background = ${colors.red}
label-urgent-padding = 3


[module/xwindow]
type = internal/xwindow

label = %title:0:45:...%

label-empty = Desktop

format = <label>

format-background = ${colors.black-alt}
format-foreground = ${colors.white}

format-padding = 2

label-font = 0


[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>

format-volume-background = ${colors.black-alt}
format-volume-foreground = ${colors.white}
format-volume-padding = 2

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-font = 2
ramp-volume-foreground = ${colors.pink}

label-volume = %percentage%%

label-muted = 󰝟 muted
label-muted-font = 2
label-muted-foreground = ${colors.gray}

click-left = pavucontrol
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%


[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/wifi-status.sh
interval = 10

format = <label>
format-background = ${colors.black-alt}
format-foreground = ${colors.white}
format-padding = 2

label = %output%

click-left = ~/.config/polybar/scripts/wifi-menu.sh


[module/battery]
type = internal/battery

battery = BAT0
adapter = AC

full-at = 100
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>

format-charging-background = ${colors.black-alt}
format-discharging-background = ${colors.black-alt}
format-full-background = ${colors.black-alt}

format-charging-padding = 2
format-discharging-padding = 2
format-full-padding = 2

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = 󰂋 100%

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁽
ramp-capacity-4 = 󰁾
ramp-capacity-5 = 󰁿
ramp-capacity-6 = 󰂀

ramp-capacity-font = 2
ramp-capacity-foreground = ${colors.pink}

animation-charging-0 = 󰂆
animation-charging-1 = 󰂇
animation-charging-2 = 󰂈
animation-charging-3 = 󰂉
animation-charging-4 = 󰂊
animation-charging-5 = 󰂋

animation-charging-font = 2
animation-charging-foreground = ${colors.pink}
animation-charging-framerate = 750


[module/date]
type = internal/date

interval = 1

date = %a %d %b
time = %H:%M

format = <label>

format-prefix = "󰥔 "
format-prefix-font = 2
format-prefix-foreground = ${colors.pink}

format-background = ${colors.black-alt}
format-foreground = ${colors.white}
format-padding = 2

label = %date%  %time%


[module/system-menu]
type = custom/script
exec = echo "󰐥"
interval = 3600

format = <label>
format-background = ${colors.black-alt}
format-foreground = ${colors.pink}
format-padding = 2

click-left = ~/.config/polybar/scripts/system-menu.sh