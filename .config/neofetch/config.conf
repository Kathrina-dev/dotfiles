# https://github.com
print_info() {
    # Raw ANSI color injection macros
    local pink="\033[38;2;255;16;240m"
    local white="\033[38;2;255;255;255m"
    local reset="\033[0m"

    # Forced truecolor string template rendering
    echo -e "${pink}$(whoami)${white}@${pink}$(hostname)${reset}"
    echo -e "${pink}------------------------------${reset}"

    echo -e "${pink}OS       :${white} $(neofetch distro --nodistro | cut -d' ' -f2-)${reset}"
    echo -e "${pink}Host     :${white} Vivobook_ASUSLaptop M6500RC${reset}"
    echo -e "${pink}Kernel   :${white} $(uname -r)${reset}"
    echo -e "${pink}Uptime   :${white} $(uptime -p | sed 's/up //')${reset}"
    echo -e "${pink}Packages :${white} $(pacman -Q | wc -l) (pacman)${reset}"
    echo -e "${pink}Shell    :${white} bash${reset}"
    echo -e "${pink}WM       :${white} i3${reset}"
    echo -e "${pink}Terminal :${white} alacritty${reset}"
    echo -e "${pink}CPU      :${white} AMD Ryzen 7 6800HS${reset}"
    echo -e "${pink}GPU      :${white} NVIDIA RTX 3050 Mobile / AMD Radeon 680M${reset}"
    echo -e "${pink}Memory   :${white} $(free -h | awk '/^Mem:/ {print $3 "/" $2}' | sed 's/Gi/ GiB/g')${reset}"
}

# ---- FORCE THE BIG ARCH LOGO ----
ascii_distro="Arch"
ascii_colors=(5)

# ---- RESET LAYOUT SPACING ----
gap=3
yoffset=0
xoffset=0
stdout="off"
image_backend="ascii"
